name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ main, trunk ]
    paths-ignore:
      - 'sql/**'
  pull_request:
    branches: [ main, trunk ]
    paths-ignore:
      - 'sql/**'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.91.0
  BOOST_ROOT: C:\local\boost_1_91_0
  OPENSSL_VERSION: 4.0.2
  OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL
  OPENSSL_MODULES: C:\Program Files\OpenSSL\bin
  OPENSSL_LIB_LEGACY: C:\Program Files\OpenSSL\lib\VC\x64\MD\liblegacy.lib
  REPO_DIR: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}\bin\builddir
    
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Check game source tabs
      shell: pwsh
      run: ./tools/dev/game_metrics.ps1 -CheckNoTabs

    - name: Create Build Environment
      shell: pwsh
      run: |
        "ARCHIVE_FILENAME=$env:CI_REPOSITORY_NAME-$env:CI_SHA_SHORT.zip" >> $env:GITHUB_ENV
        cmake -E make_directory ${{ env.BUILD_DIR }}

    - name: windows dependencies
      shell: pwsh
      run: |
        function Invoke-ChocoInstall {
          param(
            [Parameter(Mandatory = $true)]
            [string] $PackageName,
            [string[]] $PackageArgs = @(),
            [int] $Attempts = 3
          )

          for ($attempt = 1; $attempt -le $Attempts; ++$attempt) {
            choco install -y $PackageName @PackageArgs --no-progress
            if ($LASTEXITCODE -eq 0) {
              return $true
            }

            if ($attempt -lt $Attempts) {
              Start-Sleep -Seconds (30 * $attempt)
            }
          }

          return $false
        }

        function Install-ChocoPackage {
          param(
            [Parameter(Mandatory = $true)]
            [string] $PackageName,
            [string[]] $PackageArgs = @()
          )

          if (-not (Invoke-ChocoInstall -PackageName $PackageName -PackageArgs $PackageArgs)) {
            throw "choco install $PackageName failed after 3 attempts."
          }
        }

        function Install-OpenSsl {
          param(
            [Parameter(Mandatory = $true)]
            [string] $PinnedVersion
          )

          # The chocolatey openssl package downloads its installer from slproweb, which
          # keeps only the newest build per branch and deletes point releases as soon as a
          # successor ships. Any version we pin therefore 404s without warning -- that is
          # exactly how 4.0.1 broke this job. Try the pin first so builds stay reproducible,
          # then walk the feed's 4.x releases newest-first so an upstream rotation does not
          # take CI down with it. Stay on 4.x: the core needs the OpenSSL 4 legacy provider.
          $candidates = @($PinnedVersion)

          try {
            $feed = 'https://community.chocolatey.org/api/v2/FindPackagesById()?id=''openssl''&$orderby=Version%20desc&$top=40'
            $body = (Invoke-WebRequest -Uri $feed -UseBasicParsing).Content
            $candidates += [regex]::Matches($body, '<d:Version>([^<]+)</d:Version>') |
              ForEach-Object { $_.Groups[1].Value } |
              Where-Object { $_ -like '4.*' }
          } catch {
            Write-Warning "Could not read the chocolatey feed; trying the pinned version only. $_"
          }

          foreach ($version in ($candidates | Select-Object -Unique)) {
            if (Invoke-ChocoInstall -PackageName openssl -PackageArgs @("--version=$version") -Attempts 2) {
              if ($version -ne $PinnedVersion) {
                Write-Host "::warning::OPENSSL_VERSION $PinnedVersion is no longer downloadable; built against $version instead. Update OPENSSL_VERSION in .github/workflows/windows.yml."
              }
              return
            }
          }

          throw "Could not install any OpenSSL 4.x package. Tried: $($candidates -join ', ')"
        }

        Install-ChocoPackage -PackageName make
        Install-ChocoPackage -PackageName cmake -PackageArgs @("--pre")
        Install-OpenSsl -PinnedVersion $env:OPENSSL_VERSION

    - name: Cache Boost
      id: boost-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.BOOST_ROOT }}
        key: boost-${{ env.BOOST_VERSION }}-windows

    - name: Install Boost
      if: steps.boost-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $boostSource = Join-Path $env:RUNNER_TEMP "boost_1_91_0"
        $boostArchive = Join-Path $env:RUNNER_TEMP "boost_1_91_0.7z"
        Invoke-WebRequest -Uri "https://archives.boost.io/release/$env:BOOST_VERSION/source/boost_1_91_0.7z" -OutFile $boostArchive
        7z x $boostArchive "-o$env:RUNNER_TEMP" -y
        Push-Location $boostSource
        try {
          .\bootstrap.bat
          .\b2.exe install --prefix="$env:BOOST_ROOT" --with-headers -j2
        } finally {
          Pop-Location
        }

    - name: windows configure with PCH
      shell: pwsh
      run: |
        cmake -S "$env:GITHUB_WORKSPACE" -B "$env:BUILD_DIR" `
          -A x64 `
          -DTOOLS=ON `
          -DPACKET_LOG_SERVER=ON `
          -DUSE_COREPCH=ON `
          -DUSE_SCRIPTPCH=ON `
          -DSKYFIRE_BUILD_TESTS=OFF `
          -DBOOST_ROOT="$env:BOOST_ROOT" `
          -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

    - name: windows build with PCH
      shell: pwsh
      run: |
        cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE" --parallel 4

    - name: Create Upload File Name
      shell: pwsh
      run: |
        "ARCHIVE_FILENAME=${{ github.event.repository.name }}-$(git rev-parse --short HEAD).zip" >> $env:GITHUB_ENV
      
